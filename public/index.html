<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOSS-X Pairing</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:60px auto;padding:20px;background:#111;color:#eee}main{background:#1b1b1b;padding:28px;border-radius:18px}h1{margin-top:0}p{line-height:1.6}.note{padding:14px;border-radius:10px;background:#292929}</style></head><body><main><h1>BOSS-X Pairing</h1><p>Public status page for the BOSS-X WhatsApp service.</p><div class="note">Pairing is intentionally restricted to the configured owner account. Arbitrary public account linking is disabled for safety.</div><p id="status">Checking service…</p></main><script>fetch('/api/config').then(r=>r.json()).then(x=>document.getElementById('status').textContent=x.pairingEnabled?'Owner pairing is enabled on the server.':'Owner pairing is not configured yet.').catch(()=>document.getElementById('status').textContent='Service is online but configuration could not be read.');</script></body></html>
